<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Googleカレンダー連携</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        p { margin-top: 20px; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Googleカレンダー連携</h1>
    
    <!-- 初期表示用のUI -->
    <div id="initial-view">
        <p id="message">LIFFアプリを初期化中です...</p>
        <button id="googleLoginButton" style="display: none;">Googleアカウントと連携する</button>
    </div>

    <!-- 連携開始用の中間UI (初期状態は非表示) -->
    <div id="redirect-view" style="display: none;">
        <p class="description">認証を続けるには、以下のボタンをタップして外部ブラウザで操作してください。</p>
        <!-- aタグでリンクを作成し、ボタンのように見せる -->
        <a href="#" id="external-link-button" class="confirm-button" target="_blank">外部ブラウザで続ける</a>
    </div>
    
    <p id="error-message" class="error" style="display: none;"></p>

    <!-- CSSに .confirm-button を追加 -->
    <style>
        /* ... */
        .confirm-button {
            display: inline-block;
            width: 80%; max-width: 380px; padding: 15px; font-size: 18px;
            font-weight: bold; background-color: #1a73e8; color: white !important;
            border: none; border-radius: 8px; cursor: pointer;
            text-decoration: none; text-align: center;
        }
    </style>

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // ... (MY_LIFF_ID, FASTAPI_BASE_URL, GOOGLE_LOGIN_PATH は同じ) ...
        
        // ... (initializeLiff() の前半は同じ) ...
        async function initializeLiff() {
            try {
                // ... (liff.init(), liff.isLoggedIn(), liff.getProfile() は同じ) ...
                const profile = await liff.getProfile();
                
                document.getElementById('message').textContent = `${profile.displayName} さん、Googleカレンダーと連携しましょう！`;
                const loginButton = document.getElementById('googleLoginButton');
                loginButton.style.display = 'block';

                loginButton.onclick = function () {
                    // ★★★ 修正箇所 ★★★
                    // 直接リダイレクトするのではなく、中間UIを表示する
                    const googleAuthUrl = `${FASTAPI_BASE_URL}${GOOGLE_LOGIN_PATH}?line_id=${profile.userId}&display_name=${encodeURIComponent(profile.displayName)}`;
                    console.log("Generated FastAPI login URL:", googleAuthUrl);
                    
                    // aタグのhrefにURLを設定
                    document.getElementById('external-link-button').href = googleAuthUrl;
                    
                    // UIを切り替える
                    document.getElementById('initial-view').style.display = 'none';
                    document.getElementById('redirect-view').style.display = 'block';
                };

            } catch (error) {
                console.error("LIFF Initialization failed or error during process:", error);
                document.getElementById('message').textContent = 'エラーが発生しました。LIFFアプリを再度開いてみてください。';
                document.getElementById('message').classList.add('error');
            }
        }
    </script>
</body>
</html>
