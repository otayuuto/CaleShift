<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
    <title>シフト設定</title>
    <style>
    :root {
        --primary-color: #05B4C8; /* 鮮やかな水色 */
        --secondary-color: #DFF7F9; /* 薄い水色 */
        --accent-color: #FF9B00; /* オレンジ */
        --text-color: #333333;
        --background-color: #FFFFFF;
    }

    body {
        font-family: 'Noto Sans JP', sans-serif;
        background-color: var(--background-color);
        color: var(--text-color);
        margin: 20px;
    }

    h1, h2 {
        color: var(--primary-color);
        text-align: center;
        margin-top: 20px;
    }

    form {
        background: var(--secondary-color);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        max-width: 600px;
        margin: 0 auto;
    }


    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #4a4a4a;
    }

    input[type="text"], select, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
        font-size: 14px;
        background-color: #fff;
        transition: border-color 0.3s ease;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
        border-color: #4a90e2;
        outline: none;
    }

    textarea {
        min-height: 80px;
        resize: vertical;
    }

    .checkbox-group label {
        font-weight: normal;
        display: inline-block;
        margin-right: 15px;
        background: var(--secondary-color);
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
    }


    .checkbox-group input[type="checkbox"] {
        margin-right: 6px;
    }

    button {
        background-color: var(--accent-color);
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease;
        display: block;
        width: 100%;
        margin-top: 10px;
    }

    button:hover {
        background-color: #e68a00; /* オレンジの濃い色 */
    }

    .error-message {
        color: #d93025;
        margin-top: 10px;
        text-align: center;
    }

    .success-message {
        color: #188038;
        margin-top: 10px;
        text-align: center;
    }

    hr {
        border: none;
        border-top: 1px solid #ddd;
        margin: 30px 0;
    }

    /* モバイル対応 */
    @media (max-width: 600px) {
        form {
            padding: 15px;
        }

        h1, h2 {
            font-size: 1.4em;
        }

        button {
            font-size: 15px;
        }
    }
</style>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <div class="app-container">
        <h1>シフト読み取り設定</h1>
        <div id="messageArea"></div>
        <div id="debugArea" class="hidden"></div>

        <!-- ステップ1: バイト先選択 または 新規登録 -->
        <div id="step1WorkplaceSelection" class="container">
            <h2>ステップ1: バイト先を選択または新規登録</h2>
            <div class="form-group">
                <label for="existingWorkplaces">既存のバイト先:</label>
                <select id="existingWorkplaces" name="existingWorkplaces">
                    <option value="">-- 選択してください --</option>
                </select>
                <button type="button" id="selectWorkplaceBtn" style="margin-top: 10px;">このバイト先で設定する</button>
            </div>
            <p style="text-align: center; margin: 15px 0;">または</p>
            <button type="button" id="showNewWorkplaceFormBtn">新しいバイト先を登録する</button>
        </div>

        <!-- ステップ2a: 新しいバイト先の共通ルール登録フォーム -->
        <div id="newWorkplaceFormContainer" class="container hidden">
            <h2>ステップ2a: 新しいバイト先の共通ルールを登録</h2>
            <form id="newWorkplaceForm">
                <div class="form-group">
                    <label for="newWorkplaceName">バイト先名:</label>
                    <input type="text" id="newWorkplaceName" name="newWorkplaceName" required>
                </div>
                <fieldset>
                    <legend>日付のルール</legend>
                    <div class="form-group">
                        <label for="newDateFormatType">日付の主な形式:</label>
                        <select id="newDateFormatType" name="newDateFormatType">
                            <option value="YYYY/MM/DD">YYYY/MM/DD</option>
                            <option value="MM/DD">MM/DD</option>
                            <option value="MM月DD日">MM月DD日</option>
                            <option value="DD日 (曜日)">DD日 (曜日)</option>
                            <option value="DD">DD</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="newDateCustomDescription">日付に関する補足情報 (ヒント):</label>
                        <textarea id="newDateCustomDescription" name="newDateCustomDescription" placeholder="例: 各行の左端, 表の一番上の行"></textarea>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>時間のルール</legend>
                    <div class="form-group">
                        <label for="newTimeFormatType">時間の主な形式:</label>
                        <select id="newTimeFormatType" name="newTimeFormatType">
                            <option value="HH:MM-HH:MM">HH:MM-HH:MM</option>
                            <option value="HH-HH">HH-HH</option>
                            <option value="HH時～HH時">HH時～HH時</option>
                            <option value="開始時刻と終了時刻が別々の欄">開始時刻と終了時刻が別々の欄</option>
                            <option value="H">H</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>"休み" の表記 (複数選択可):</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="newRestIndicator" value="休"> 休</label>
                            <label><input type="checkbox" name="newRestIndicator" value="OFF"> OFF</label>
                            <label><input type="checkbox" name="newRestIndicator" value="×"> ×</label>
                            <label><input type="checkbox" name="newRestIndicator" value="／"> ／</label>
                            <label><input type="checkbox" name="newRestIndicator" value="空白セル"> 空白セル</label>
                            <label><input type="checkbox" name="newRestIndicator" value="指定なし"> 指定なし</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="newTimeCustomDescription">時間に関する補足情報 (ヒント):</label>
                        <textarea id="newTimeCustomDescription" name="newTimeCustomDescription" placeholder="例: 時間は名前のすぐ右のセル"></textarea>
                    </div>
                </fieldset>
                <button type="submit">このバイト先を登録</button>
                <button type="button" id="cancelNewWorkplaceBtn" style="margin-top:5px;">キャンセル</button>
            </form>
        </div>

        <!-- ステップ2b: あなたのシフト名設定フォーム -->
        <div id="mySettingFormContainer" class="container hidden">
            <h2 id="mySettingWorkplaceName"></h2>
            <form id="mySettingForm">
                <input type="hidden" id="selectedWorkplaceId" name="selectedWorkplaceId">
                <div class="form-group">
                    <label for="targetNameInShift">このバイト先のシフト表でのあなたの名前:</label>
                    <input type="text" id="targetNameInShift" name="targetNameInShift" required>
                </div>
                <button type="submit">この名前で設定を保存</button>
                <button type="button" id="backToWorkplaceSelectionBtn" style="margin-top:5px;">バイト先選択に戻る</button>
            </form>
        </div>
    </div>

    
 async function prepareMySettingForm(workplaceId, workplaceName) {   
    <script>
        let lineUserId = null;
        // ★★★ 1. あなたのLIFF IDに置き換えてください ★★★
        let liffId = "2007484618-lebNA4n8"; // 例: "2007484618-lebNA4n8"

        // ★★★ 2. あなたの現在のngrokのHTTPS URL (末尾スラッシュなし) に置き換えてください ★★★
        const API_BASE_URL = "https://caleshift-service-822292825577.asia-northeast1.run.app"; // 例: "https://xxxx.ngrok-free.app"

        // DOM要素の取得
        const messageArea = document.getElementById('messageArea');
        const targetNameInShiftInput = document.getElementById('targetNameInShift');
        const debugArea = document.getElementById('debugArea');
        const step1Div = document.getElementById('step1WorkplaceSelection');
        const newWorkplaceFormContainer = document.getElementById('newWorkplaceFormContainer');
        const mySettingFormContainer = document.getElementById('mySettingFormContainer');
        const existingWorkplacesSelect = document.getElementById('existingWorkplaces');
        const selectWorkplaceBtn = document.getElementById('selectWorkplaceBtn');
        const showNewWorkplaceFormBtn = document.getElementById('showNewWorkplaceFormBtn');
        const newWorkplaceForm = document.getElementById('newWorkplaceForm');
        const cancelNewWorkplaceBtn = document.getElementById('cancelNewWorkplaceBtn');
        const mySettingForm = document.getElementById('mySettingForm');
        const mySettingWorkplaceNameHeader = document.getElementById('mySettingWorkplaceName');
        const selectedWorkplaceIdInput = document.getElementById('selectedWorkplaceId');
        const backToWorkplaceSelectionBtn = document.getElementById('backToWorkplaceSelectionBtn');

        function displayDebugInfo(title, errorOrData) {
            debugArea.classList.remove('hidden');
            let debugMessage = `<h3 style="margin-top:0; margin-bottom:5px; font-size:1.1em; color: #a00;">--- ${title} ---</h3>\n`;
            if (errorOrData instanceof Error) {
                debugMessage += `<p style="margin:2px 0;"><strong>Name:</strong> ${escapeHtml(errorOrData.name)}</p>\n`;
                debugMessage += `<p style="margin:2px 0;"><strong>Message:</strong> ${escapeHtml(errorOrData.message)}</p>\n`;
                if (errorOrData.stack) {
                    const stackLines = errorOrData.stack.split('\n');
                    const shortStack = stackLines.map(line => {
                        return escapeHtml(line).replace(/(https?:\/\/[^\s:]+)(:\d+:\d+)/g, (match, p1, p2) => {
                            const parts = p1.split('/');
                            if (parts.length > 3) { return `.../${parts.slice(-2).join('/')}${p2}`; }
                            return match;
                        });
                    }).join('\n');
                    debugMessage += `<p style="margin:2px 0;"><strong>Stack:</strong></p><pre style="margin-top:0; font-size:0.9em; background:#fff5f5; padding:5px; border-radius:3px;">${shortStack}</pre>\n`;
                }
                if ('lineNumber' in errorOrData && errorOrData.lineNumber !== undefined) debugMessage += `<p style="margin:2px 0;">Line: ${errorOrData.lineNumber}</p>\n`;
                if ('columnNumber' in errorOrData && errorOrData.columnNumber !== undefined) debugMessage += `<p style="margin:2px 0;">Column: ${errorOrData.columnNumber}</p>\n`;
                if ('fileName' in errorOrData && errorOrData.fileName) debugMessage += `<p style="margin:2px 0;">File: ${escapeHtml(errorOrData.fileName.split('/').pop())}</p>\n`;
                if ('sourceURL' in errorOrData && errorOrData.sourceURL) debugMessage += `<p style="margin:2px 0;">Source URL: .../${escapeHtml(errorOrData.sourceURL.split('/').slice(-2).join('/'))}</p>\n`;
            } else if (typeof errorOrData === 'string') {
                debugMessage += `<pre style="margin-top:0; font-size:0.9em; background:#fff5f5; padding:5px; border-radius:3px;">${escapeHtml(errorOrData)}</pre>\n`;
            } else {
                try {
                    debugMessage += `<pre style="margin-top:0; font-size:0.9em; background:#fff5f5; padding:5px; border-radius:3px;">${escapeHtml(JSON.stringify(errorOrData, null, 2))}</pre>\n`;
                } catch (e) {
                    debugMessage += "<p>Could not stringify data object.</p>\n";
                }
            }
            debugArea.innerHTML += `<div style="border-bottom: 1px dotted #ffc2c2; margin-bottom:10px; padding-bottom:10px;">${debugMessage}</div>`;
        }

        function escapeHtml(unsafe) {
            if (typeof unsafe !== 'string') {
                try { unsafe = String(unsafe); } catch (e) { return '[Unescapable Object]'; }
            }
            return unsafe
                 .replace(/&/g, '&')
                 .replace(/</g, '<')
                 .replace(/>/g, '>')
                 .replace(/"/g, '"')
                 .replace(/'/g, "'");
        }

        async function initializeLiff() {
            debugArea.innerHTML = ""; // 初期化時にデバッグエリアをクリア
            try {
                messageArea.textContent = "LIFFを初期化中..."; messageArea.className = 'info-message';
                await liff.init({ liffId: liffId });
                if (liff.getOS() === 'web') {
                    console.warn("PCブラウザで実行中。テスト用のユーザーIDを使用します。");
                    lineUserId = "pc-test-user-001";
                    messageArea.textContent = `PCブラウザモード (テスト用ID: ${lineUserId})`;
                    messageArea.className = 'info-message';
                    displayDebugInfo("LIFF Mode", { os: liff.getOS(), context: "PC Browser", assignedUserId: lineUserId });
                } else if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    lineUserId = profile.userId;
                    console.log("LIFF initialized. User ID:", lineUserId);
                    messageArea.textContent = `ログインユーザーID: ${lineUserId}`;
                    messageArea.className = 'info-message';
                    displayDebugInfo("LIFF Mode", { os: liff.getOS(), context: "LINE App - Logged In", userId: lineUserId, displayName: profile.displayName });
                } else {
                    messageArea.textContent = "LINEログインが必要です。";
                    messageArea.className = 'error-message';
                    displayDebugInfo("Login Check Failed", new Error("liff.isLoggedIn() is false and not on web."));
                    return;
                }
                await loadWorkplaces();
                showStep(step1Div);
            } catch (error) {
                console.error("LIFF Initialization or Profile acquisition failed", error);
                messageArea.textContent = `LIFF初期化エラー: ${error.message}`;
                messageArea.className = 'error-message';
                displayDebugInfo("LIFF Initialization Error", error);
            }
        }

        function showStep(stepElement) {
            step1Div.classList.add('hidden');
            newWorkplaceFormContainer.classList.add('hidden');
            mySettingFormContainer.classList.add('hidden');
            if(stepElement) stepElement.classList.remove('hidden');
        }

        async function loadWorkplaces() {
            if (!lineUserId) {
                 messageArea.textContent = "ユーザーID未取得のためバイト先を読込できません。";
                 messageArea.className = 'error-message';
                 displayDebugInfo("Load Workplaces Pre-check", new Error("lineUserId is null or undefined. Cannot load workplaces."));
                 return;
            }
            try {
                messageArea.textContent = "バイト先一覧を読み込み中...";
                messageArea.className = 'info-message';
                displayDebugInfo("Load Workplaces - Requesting", `URL: ${API_BASE_URL}/api/v1/workplaces`);

                const response = await fetch(`${API_BASE_URL}/api/v1/workplaces`, {
                    method: 'GET',
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                const responseForDebug = response.clone();

                const headersForDebug = {};
                responseForDebug.headers.forEach((value, name) => headersForDebug[name] = value);
                displayDebugInfo("Load Workplaces - Response Headers", { status: responseForDebug.status, statusText: responseForDebug.statusText, ok: responseForDebug.ok, headers: headersForDebug });

                const responseText = await responseForDebug.text();
                displayDebugInfo("Load Workplaces - Raw Response Text", responseText.substring(0, 1000) + (responseText.length > 1000 ? "..." : ""));

                if (!response.ok) {
                    throw new Error(`Failed to load workplaces: ${response.status} ${response.statusText}. Response: ${responseText.substring(0,500)}`);
                }

                const contentType = response.headers.get("content-type");
                if (contentType && contentType.toLowerCase().includes("application/json")) {
                    const workplaces = await response.json();
                    console.log("Fetched workplaces (parsed JSON):", workplaces);
                    displayDebugInfo("Load Workplaces - Parsed JSON", { message: "Data received and parsed from API", data: workplaces });

                    existingWorkplacesSelect.innerHTML = '<option value="">-- 選択してください --</option>';
                    if (workplaces && workplaces.length > 0) {
                        workplaces.forEach(wp => {
                            const option = document.createElement('option');
                            option.value = wp.workplace_id;
                            option.textContent = wp.workplace_name;
                            existingWorkplacesSelect.appendChild(option);
                        });
                        messageArea.textContent = "バイト先一覧を読み込みました。";
                        messageArea.className = 'success-message';
                    } else {
                        messageArea.textContent = "登録されているバイト先はありません。新しいバイト先を登録してください。";
                        messageArea.className = 'info-message';
                    }
                } else {
                    throw new Error(`Unexpected content type: ${contentType}. Expected application/json. Response was: ${responseText.substring(0,300)}`);
                }
            } catch (error) {
                console.error("Error in loadWorkplaces function:", error);
                messageArea.textContent = `バイト先一覧の読み込みに失敗: ${error.name}: ${error.message}`;
                messageArea.className = 'error-message';
                displayDebugInfo("Load Workplaces - Catch Block Error", error);
            }
        }

        showNewWorkplaceFormBtn.addEventListener('click', () => {
            debugArea.innerHTML = ""; // 新規フォーム表示時にデバッグエリアをクリア
            showStep(newWorkplaceFormContainer);
            newWorkplaceForm.reset();
            messageArea.textContent = "新しいバイト先の情報を入力してください。";
            messageArea.className = 'info-message';
        });

        cancelNewWorkplaceBtn.addEventListener('click', () => {
            showStep(step1Div);
            messageArea.textContent = "バイト先登録をキャンセルしました。";
            messageArea.className = 'info-message';
        });

        newWorkplaceForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            debugArea.innerHTML = "";
            if (!lineUserId) {
                messageArea.textContent = "ユーザーIDが取得できません。"; messageArea.className = 'error-message';
                displayDebugInfo("Submit New Workplace Error", new Error("lineUserId is null or undefined before API call."));
                return;
            }
            const formData = new FormData(newWorkplaceForm);
            const newRestIndicators = [];
            newWorkplaceForm.querySelectorAll('input[name="newRestIndicator"]:checked').forEach(cb => newRestIndicators.push(cb.value));
            const payload = {
                workplace_name: formData.get('newWorkplaceName'),
                settings: {
                    date_rules: { format_type: formData.get('newDateFormatType'), custom_description: formData.get('newDateCustomDescription') || null },
                    time_rules: { format_type: formData.get('newTimeFormatType'), rest_indicators: newRestIndicators, custom_description: formData.get('newTimeCustomDescription') || null }
                },
                current_line_user_id: lineUserId
            };
            displayDebugInfo("Submitting New Workplace Data", { message: "Data to be sent to API", data: payload });
            try {
                messageArea.textContent = "バイト先を登録中..."; messageArea.className = 'info-message';
                const response = await fetch(`${API_BASE_URL}/api/v1/workplaces`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' }, body: JSON.stringify(payload)
                });
                const responseForDebug = response.clone();
                const resultText = await responseForDebug.text();
                displayDebugInfo("Create New Workplace - API Response", { status: response.status, statusText: response.statusText, body: resultText.substring(0, 500) });
                if (response.ok) {
                    const result = await response.json();
                    messageArea.textContent = `バイト先「${result.workplace_name}」を登録しました。次にあなたの名前を設定してください。`;
                    messageArea.className = 'success-message';
                    await loadWorkplaces();
                    prepareMySettingForm(result.workplace_id, result.workplace_name);
                } else {
                    let errorMsg = `バイト先の登録に失敗 (${response.status} ${response.statusText})`;
                    try { const errorJson = JSON.parse(resultText); if (errorJson.detail) { errorMsg += ` - ${typeof errorJson.detail === 'string' ? errorJson.detail : JSON.stringify(errorJson.detail)}`; } } catch(e) {}
                    throw new Error(errorMsg);
                }
            } catch (error) {
                console.error("Error creating new workplace:", error);
                messageArea.textContent = `エラー: ${error.message}`; messageArea.className = 'error-message';
                displayDebugInfo("Create New Workplace API Error", error);
            }
        });

        selectWorkplaceBtn.addEventListener('click', () => {
            debugArea.innerHTML = "";
            const selectedId = existingWorkplacesSelect.value;
            if (selectedId) {
                const selectedName = existingWorkplacesSelect.options[existingWorkplacesSelect.selectedIndex].text;
                prepareMySettingForm(selectedId, selectedName);
            } else {
                messageArea.textContent = "バイト先を選択してください。";
                messageArea.className = 'info-message';
            }
        });

        async function prepareMySettingForm(workplaceId, workplaceName) {
            mySettingWorkplaceNameHeader.textContent = `バイト先: ${workplaceName} でのあなたの名前設定`;
            selectedWorkplaceIdInput.value = workplaceId; // 選択されたバイト先のIDをhidden inputに保持
            targetNameInShiftInput.value = ""; // 名前入力欄をクリア

            messageArea.textContent = `「${workplaceName}」の既存のあなたの名前設定を読み込み中...`;
            messageArea.className = 'info-message';
            // debugArea.innerHTML = ""; // 必要ならクリア

            if (!lineUserId || !workplaceId) {
                messageArea.textContent = "ユーザーIDまたはバイト先IDが不明なため、既存の設定を読み込めません。";
                messageArea.className = 'error-message';
                displayDebugInfo("Prepare My Setting Form Error - Pre-check", new Error("lineUserId or workplaceId is null/empty for GET request."));
                showStep(mySettingFormContainer);
                return;
            }

            try {
                displayDebugInfo("Get My Workplace Setting - Requesting", `URL: ${API_BASE_URL}/api/v1/users/${lineUserId}/my-workplace-settings/${workplaceId}`);
                const response = await fetch(`${API_BASE_URL}/api/v1/users/${lineUserId}/my-workplace-settings/${workplaceId}`, {
                    method: 'GET',
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                const responseForDebug = response.clone();
                const responseText = await responseForDebug.text();
                const headersForDebug = {};
                responseForDebug.headers.forEach((value, name) => headersForDebug[name] = value);

                displayDebugInfo("Get My Workplace Setting - API Response Headers", {
                    status: responseForDebug.status,
                    statusText: responseForDebug.statusText,
                    ok: responseForDebug.ok,
                    headers: headersForDebug
                });
                displayDebugInfo("Get My Workplace Setting - API Raw Response Text", responseText.substring(0,500));


                if (response.ok) {
                    if (response.status === 204 || !responseText.trim()) {
                        messageArea.textContent = `「${workplaceName}」でのあなたの名前は未設定です。新しく入力してください。`;
                        messageArea.className = 'info-message';
                    } else {
                        const contentType = response.headers.get("content-type");
                        if (contentType && contentType.toLowerCase().includes("application/json")) {
                            const setting = await response.json();
                            if (setting && setting.target_name_in_shift) {
                                targetNameInShiftInput.value = setting.target_name_in_shift;
                                messageArea.textContent = `「${workplaceName}」での既存の名前「${setting.target_name_in_shift}」を読み込みました。変更も可能です。`;
                                messageArea.className = 'success-message';
                                displayDebugInfo("Get My Workplace Setting - Parsed JSON", setting);
                            } else {
                                messageArea.textContent = `「${workplaceName}」でのあなたの名前は未設定です。新しく入力してください。`;
                                messageArea.className = 'info-message';
                                displayDebugInfo("Get My Workplace Setting - Parsed JSON (but no setting or target_name)", setting);
                            }
                        } else {
                            throw new Error(`Unexpected content type: ${contentType}. Expected application/json. Response: ${responseText.substring(0,300)}`);
                        }
                    }
                } else if (response.status === 404) {
                     messageArea.textContent = `「${workplaceName}」でのあなたの名前は未設定です。新しく入力してください。`;
                     messageArea.className = 'info-message';
                     displayDebugInfo("Get My Workplace Setting - API Response 404", "Setting not found by API.");
                } else {
                    let errorMsg = `既存の設定の読み込みに失敗 (${response.status} ${response.statusText})`;
                    try { const errorJson = JSON.parse(responseText); if (errorJson.detail) { errorMsg += ` - ${typeof errorJson.detail === 'string' ? errorJson.detail : JSON.stringify(errorJson.detail)}`; } } catch(e) {}
                    throw new Error(errorMsg);
                }
            } catch (error) {
                console.error("Error loading my workplace setting:", error);
                messageArea.textContent = `既存の設定の読み込み中にエラー: ${error.message}`;
                messageArea.className = 'error-message';
                displayDebugInfo("Load My Workplace Setting - Catch Block Error", error);
            } finally {
                showStep(mySettingFormContainer); // 最終的に名前設定フォームを表示
            }
        }

        // ★★★ mySettingForm の submit イベントリスナー (名前の保存/更新) ★★★
        mySettingForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            debugArea.innerHTML = ""; // デバッグエリアをクリア
            const currentWorkplaceId = selectedWorkplaceIdInput.value; // hidden inputからバイト先IDを取得
            if (!lineUserId || !currentWorkplaceId) {
                messageArea.textContent = "ユーザーIDまたはバイト先IDが不明です。"; messageArea.className = 'error-message';
                displayDebugInfo("Submit My Setting Error", new Error("lineUserId or currentWorkplaceId is null/empty."));
                return;
            }
            const payload = {
                target_name_in_shift: targetNameInShiftInput.value // ★ 修正: document.getElementByIdから取得するのではなく、既にある変数を使う
            };
            displayDebugInfo("Submitting My Workplace Setting Data", { message: "Data to be sent to API", data: payload, workplaceId: currentWorkplaceId, userId: lineUserId });

            try {
                messageArea.textContent = "設定を保存中..."; messageArea.className = 'info-message';
                const response = await fetch(`${API_BASE_URL}/api/v1/users/${lineUserId}/my-workplace-settings/${currentWorkplaceId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify(payload)
                });
                const responseForDebug = response.clone();
                const resultText = await responseForDebug.text();
                displayDebugInfo("Save My Workplace Setting - API Response", { status: response.status, statusText: response.statusText, body: resultText.substring(0, 500) });

                if (response.ok) {
                    const result = await response.json();
                    const workplaceNameForDisplay = mySettingWorkplaceNameHeader.textContent.replace("バイト先: ", "").replace(" でのあなたの名前設定", "");
                    messageArea.textContent = `バイト先「${workplaceNameForDisplay}」での名前「${result.target_name_in_shift}」を保存しました。`;
                    messageArea.className = 'success-message';
                    showStep(step1Div); // 最初の画面に戻る
                } else {
                    let errorMsg = `設定の保存に失敗 (${response.status} ${response.statusText})`;
                    try { const errorJson = JSON.parse(resultText); if (errorJson.detail) { errorMsg += ` - ${typeof errorJson.detail === 'string' ? errorJson.detail : JSON.stringify(errorJson.detail)}`; } } catch(e) {}
                    throw new Error(errorMsg);
                }
            } catch (error) {
                console.error("Error saving my workplace setting:", error);
                messageArea.textContent = `エラー: ${error.message}`; messageArea.className = 'error-message';
                displayDebugInfo("Save My Workplace Setting API Error", error);
            }
        });

        backToWorkplaceSelectionBtn.addEventListener('click', () => {
            showStep(step1Div);
            messageArea.textContent = "バイト先選択に戻りました。";
            messageArea.className = 'info-message';
        });

        document.addEventListener('DOMContentLoaded', initializeLiff);
    </script>
</body>
</html>
